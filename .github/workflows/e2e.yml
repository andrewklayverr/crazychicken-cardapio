name: E2E Playwright

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Type-check E2E suite
        run: npm run test:e2e:types

      - name: Lint project and E2E suite
        run: npm run lint

      - name: Run business and security checks
        run: |
          npm run test:store
          npm run test:security
          npm run test:whatsapp
          npm run test:mercado-pago
          npm run test:node

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Run E2E suite
        run: npm run test:e2e

      - name: Build production application
        run: npm run build

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14

  visual:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout with visual baselines
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run visual regression
        run: npm run test:visual

      - name: Upload visual diffs and report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-report
          path: |
            playwright-report
            test-results
          retention-days: 14
